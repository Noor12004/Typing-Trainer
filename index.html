<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Typing Speed Trainer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>⌨️ Typing Speed Trainer</h1>

    <div id="test-container">
      <p id="quote">Press "Start" to begin!</p>
      <textarea id="input" placeholder="Start typing here..." disabled></textarea>
    </div>

    <div id="stats">
      <span>⏱️ Time: <span id="time">0</span>s</span>
      <span>⚡ WPM: <span id="wpm">0</span></span>
      <span>🎯 Accuracy: <span id="accuracy">0</span>%</span>
    </div>

    <button id="start-btn">Start Test</button>

    <script src="renderer.js"></script>
  </body>
</html>
